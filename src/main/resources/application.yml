spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sidekick
    username: sidekick
    password: sidekick
  jpa:
    hibernate:
      ddl-auto: update # dev convenience (PLAN §4); Flyway retrofit deferred
    open-in-view: false

  modulith:
    events:
      # If the app shuts down before an async listener ran (e.g. a one-shot
      # CLI ingest), replay the event on next startup instead of losing it.
      republish-outstanding-events-on-restart: true

sidekick:
  embedding:
    model-path: models/bge-small-en-v1.5/model.onnx
    tokenizer-path: models/bge-small-en-v1.5/tokenizer.json
    pooling: CLS # official recipe for bge-v1.5 (see ADR context in PLAN §6)
  retrieval:
    query-prefix: "" # optionally the bge instruction prefix; the eval judges it
