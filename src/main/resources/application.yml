spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sidekick
    username: sidekick
    password: sidekick
  jpa:
    hibernate:
      ddl-auto: update # dev convenience (PLAN §4); Flyway retrofit deferred
    open-in-view: false

  modulith:
    events:
      # If the app shuts down before an async listener ran (e.g. a one-shot
      # CLI ingest), replay the event on next startup instead of losing it.
      republish-outstanding-events-on-restart: true

sidekick:
  embedding:
    model-path: models/bge-small-en-v1.5/model.onnx
    tokenizer-path: models/bge-small-en-v1.5/tokenizer.json
    pooling: CLS # official recipe for bge-v1.5 (see ADR context in PLAN §6)
  retrieval:
    # Config chosen by eval grid sweep 2026-08-31 (92% hit rate, 23/25;
    # neighboring cells 88% — see work/eval-runs/). PLAIN/PREFIXED and
    # cap=0 remain available for experiments.
    query-mode: FUSED
    query-prefix: "Represent this sentence for searching relevant passages: "
    max-per-section: 2
  eval:
    top-k: 6
