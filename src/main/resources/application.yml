spring:
  servlet:
    multipart:
      max-file-size: 20MB # SIDs run 1-2MB; generous headroom, still bounded
      max-request-size: 21MB
  datasource:
    url: jdbc:postgresql://localhost:5432/sidekick
    username: sidekick
    password: sidekick
  jpa:
    hibernate:
      ddl-auto: update # dev convenience (PLAN §4); Flyway retrofit deferred
    open-in-view: false

  modulith:
    events:
      # If the app shuts down before an async listener ran (e.g. a one-shot
      # CLI ingest), replay the event on next startup instead of losing it.
      republish-outstanding-events-on-restart: true

sidekick:
  ingest:
    # ADR-007: the eval corpus is pinned — uploads may never replace these.
    pinned-funds: hdfc-flexi-cap,sbi-small-cap,icici-bluechip,icici-longterm-equity
  embedding:
    model-path: models/bge-small-en-v1.5/model.onnx
    tokenizer-path: models/bge-small-en-v1.5/tokenizer.json
    pooling: CLS # official recipe for bge-v1.5 (see ADR context in PLAN §6)
  retrieval:
    # Config chosen by eval grid sweep 2026-08-31 (92% hit rate, 23/25;
    # neighboring cells 88% — see work/eval-runs/). PLAIN/PREFIXED and
    # cap=0 remain available for experiments.
    query-mode: FUSED
    query-prefix: "Represent this sentence for searching relevant passages: "
    max-per-section: 2
  eval:
    top-k: 6
    question-delay-millis: 6000 # free routes rate-limit per minute; be gentle
  answering:
    # Benchmarked 2026-09-03 (30-case full eval, prompt v2): minimax-m3:free
    # scored 100% citation discipline / 96.7% refusal correctness with zero
    # provider errors; gemma-4-31b-it:free was upstream-rate-limited (28/30
    # failed), glm-5.2:free rate-limited entirely. Reports: work/eval-runs/.
    model: minimax/minimax-m3:free
    top-k: 6
    min-top-score: 0.5 # gate-1 FLOOR only — see ADR-008 on why not higher
